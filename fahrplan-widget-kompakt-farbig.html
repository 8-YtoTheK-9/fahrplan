<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nächste Busse: Vaduz Post nach Mauren Vogelparadies</title>
<style>
  :root{
    --gruen:#45a12b;
    --text:#3b3b3b;
    --grau:#666666;
    --linie:#d9e2dd;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    margin:0;
    padding:clamp(8px,2vh,16px) clamp(10px,2vw,18px);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--text);
    background:#fff;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding-bottom:clamp(4px,1vh,8px);
    border-bottom:2px solid var(--gruen);
    flex:0 0 auto;
  }
  h1{
    font-size:clamp(13px,3.2vh,17px);
    line-height:1.25;
    font-weight:700;
    margin:0;
  }
  .jetzt{
    margin-left:auto;
    font-size:clamp(11px,2.2vh,13px);
    color:var(--grau);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  ul{
    list-style:none;
    margin:0;
    padding:0;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    min-height:0;
    overflow:hidden;
  }
  li{
    display:flex;
    align-items:baseline;
    gap:clamp(6px,1.5vw,14px);
    padding:clamp(2px,0.8vh,8px) 0;
    border-bottom:1px solid var(--linie);
  }
  li:last-child{border-bottom:0}
  .zeit{
    font-size:clamp(17px,5vh,28px);
    font-weight:700;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .verspaetung{color:#b4381f;font-size:0.55em;font-weight:700;margin-left:3px}
  .mitte{
    font-size:clamp(11px,2.4vh,14px);
    color:var(--grau);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
  }
  .linie{
    display:inline-block;
    background:var(--gruen);
    color:#fff;
    border-radius:4px;
    padding:2px 9px;
    font-weight:700;
    font-size:1.05em;
    margin-right:7px;
    letter-spacing:.02em;
  }
  .abfahrt-in{
    font-size:clamp(12px,2.6vh,16px);
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    margin-left:auto;
    font-variant-numeric:tabular-nums;
  }
  .hinweis{
    font-size:clamp(11px,2.4vh,14px);
    color:var(--grau);
    padding:6px 0;
  }
  .hinweis a{color:var(--gruen)}
</style>
</head>
<body>

<header>
  <h1>Vaduz Post → Mauren Vogelparadies</h1>
  <span class="jetzt" id="jetzt"></span>
</header>

<ul id="liste"></ul>
<div class="hinweis" id="status">Verbindungen werden geladen.</div>

<script>
(function(){
  // Linienfarben, hier bei Bedarf anpassen (Wert aus dem Liniennetzplan)
  var LINIENFARBEN = {
    "11": "#fcc300",   // LIEmobil gelb
    "12": "#fcc300",
    "13": "#45a12b",   // LIEmobil gruen
    "13E": "#45a12b",
    "14": "#45a12b"
  };
  var STANDARDFARBE = "#45a12b";

  var VON = "Vaduz, Post";
  var NACH_VARIANTEN = ["Mauren FL, Vogelparadies", "Mauren, Vogelparadies", "Vogelparadies"];
  var ANZAHL = 3;

  var liste = document.getElementById("liste");
  var status = document.getElementById("status");
  var jetztFeld = document.getElementById("jetzt");

  function zweistellig(n){ return (n < 10 ? "0" : "") + n; }
  function uhrzeit(d){ return zweistellig(d.getHours()) + ":" + zweistellig(d.getMinutes()); }
  function minutenBis(d){ return Math.round((d.getTime() - Date.now()) / 60000); }

  function holen(ziel){
    var url = "https://transport.opendata.ch/v1/connections"
      + "?from=" + encodeURIComponent(VON)
      + "&to=" + encodeURIComponent(ziel)
      + "&limit=" + ANZAHL;
    return fetch(url).then(function(a){
      if(!a.ok){ throw new Error("HTTP " + a.status); }
      return a.json();
    });
  }

  function holenMitVarianten(i){
    i = i || 0;
    if(i >= NACH_VARIANTEN.length){ return Promise.resolve({connections: []}); }
    return holen(NACH_VARIANTEN[i]).then(function(d){
      if(d.connections && d.connections.length){ return d; }
      return holenMitVarianten(i + 1);
    });
  }

  function zeichnen(verbindungen){
    liste.innerHTML = "";
    verbindungen.forEach(function(v){
      var ab = new Date(v.from.departure);
      var an = new Date(v.to.arrival);
      var abschnitt = (v.sections || []).find(function(s){ return s.journey; });
      var linie = abschnitt && abschnitt.journey ? (abschnitt.journey.number || abschnitt.journey.category || "Bus") : "Bus";
      var umstiege = v.transfers || 0;
      var minuten = minutenBis(ab);

      var eintrag = document.createElement("li");

      var zeit = document.createElement("span");
      zeit.className = "zeit";
      zeit.textContent = uhrzeit(ab);
      if(v.from.delay){
        var vs = document.createElement("span");
        vs.className = "verspaetung";
        vs.textContent = "+" + v.from.delay;
        zeit.appendChild(vs);
      }

      var mitte = document.createElement("span");
      mitte.className = "mitte";
      var badge = document.createElement("span");
      badge.className = "linie";
      badge.textContent = linie;
      badge.style.background = LINIENFARBEN[String(linie)] || STANDARDFARBE;
      mitte.appendChild(badge);
      mitte.appendChild(document.createTextNode(
        "an " + uhrzeit(an) + (umstiege ? ", " + umstiege + "x umsteigen" : ", direkt")
      ));

      var rest = document.createElement("span");
      rest.className = "abfahrt-in";
      rest.textContent = minuten <= 0 ? "jetzt" : "in " + minuten + " Min.";

      eintrag.appendChild(zeit);
      eintrag.appendChild(mitte);
      eintrag.appendChild(rest);
      liste.appendChild(eintrag);
    });
  }

  function laden(){
    jetztFeld.textContent = uhrzeit(new Date()) + " Uhr";
    holenMitVarianten().then(function(d){
      var verbindungen = (d.connections || []).filter(function(v){
        return minutenBis(new Date(v.from.departure)) >= 0;
      });
      if(!verbindungen.length){
        liste.innerHTML = "";
        status.textContent = "Zurzeit keine Verbindung gefunden.";
        status.style.display = "";
        return;
      }
      zeichnen(verbindungen);
      status.style.display = "none";
    }).catch(function(f){
      liste.innerHTML = "";
      status.style.display = "";
      status.innerHTML = 'Fahrplandaten nicht abrufbar. <a href="https://liemobil.li/de/fahrplan#fahrplanabfrage" target="_blank" rel="noopener">Fahrplan LIEmobil</a>';
    });
  }

  laden();
  setInterval(laden, 60000);
})();
</script>

</body>
</html>
